<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - LI3 Media</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            margin: 0;
            padding: 0;
        }

        .wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: #1f2937;
            border-radius: 18px;
            padding: 36px 30px;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .logo {
            margin-bottom: 16px;
        }

        .logo img {
            width: 90px;
            height: auto;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .icon {
            font-size: 52px;
            margin-bottom: 16px;
        }

        .title {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .message {
            font-size: 16px;
            line-height: 1.6;
            color: #d1d5db;
            margin-bottom: 28px;
        }

        .button {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: bold;
            margin: 6px;
        }

        .button.secondary {
            background: #374151;
        }

        .success {
            color: #86efac;
        }

        .error {
            color: #fca5a5;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="logo">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="LI3 Media Logo">
            </div>

            <div class="brand">LI3 Media</div>

            <div class="icon">
                {% if status == "success" %}
                    ✅
                {% else %}
                    ⚠️
                {% endif %}
            </div>

            <h1 class="title {% if status == 'success' %}success{% else %}error{% endif %}">
                {{ title }}
            </h1>

            <p class="message">{{ message }}</p>

            {% if status == "success" %}
                <a href="{{ url_for('login') }}" class="button">Go to Login</a>
            {% else %}
                <a href="{{ url_for('resend_verification') }}" class="button">Resend Verification</a>
                <a href="{{ url_for('login') }}" class="button secondary">Back to Login</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
